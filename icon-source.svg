<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- thin gold rule, echoing the app's letterhead -->
  <rect x="0" y="300" width="1024" height="6" fill="url(#gold)"/>

  <!-- shield -->
  <path d="M512 160
           L 700 230
           L 700 520
           C 700 680 610 800 512 860
           C 414 800 324 680 324 520
           L 324 230
           Z"
        fill="none" stroke="url(#gold)" stroke-width="16" stroke-linejoin="round"/>

  <!-- ledger tick marks inside the shield -->
  <g stroke="#fbbf24" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="400" y1="420" x2="624" y2="420"/>
    <line x1="400" y1="490" x2="624" y2="490"/>
    <line x1="400" y1="560" x2="560" y2="560"/>
  </g>
</svg>
